name: Daily Auto-Refresh Sync (4:00 AM IST)

on:
  schedule:
    # 4:00 AM IST is 22:30 UTC
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Leaderboard & Task Rollout Sync
        env:
          APP_URL: ${{ secrets.DEPLOYED_APP_URL || secrets.NEXT_PUBLIC_APP_URL || 'https://ocd-repo.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering auto-refresh sync at $APP_URL/api/cron/sync..."
          curl -f -s -X POST "$APP_URL/api/cron/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" || \
          curl -f -s "$APP_URL/api/cron/sync?key=$CRON_SECRET"

